name: NBA prelock robustness regression
on:
  workflow_dispatch:
  push:
    branches: [dev/streamlit-runtime-validation]
    paths:
      - 'nba_live_prelock_fragility.py'
      - 'test_nba_live_prelock_fragility.py'
      - 'test_nba_prelock_ui_integration.py'
      - 'test_nba_optimizer_integration.py'
      - 'test_nba_csv_pipeline_integration.py'
      - 'nba_archived_slate_audit.py'
      - 'test_nba_archived_slate_audit.py'
      - 'nba_archived_export_adapter.py'
      - 'test_nba_archived_export_adapter.py'
      - 'nba_archive_zip_benchmark.py'
      - 'test_nba_archive_zip_benchmark.py'
      - 'model.py'
      - 'slate_import.py'
      - 'nba_prelock_robustness.py'
      - 'test_nba_prelock_robustness.py'
      - 'site_ui.py'
      - '.github/workflows/nba-prelock-robustness.yml'
  pull_request:
    paths:
      - 'nba_live_prelock_fragility.py'
      - 'test_nba_live_prelock_fragility.py'
      - 'test_nba_prelock_ui_integration.py'
      - 'test_nba_optimizer_integration.py'
      - 'test_nba_csv_pipeline_integration.py'
      - 'nba_archived_slate_audit.py'
      - 'test_nba_archived_slate_audit.py'
      - 'nba_archived_export_adapter.py'
      - 'test_nba_archived_export_adapter.py'
      - 'nba_archive_zip_benchmark.py'
      - 'test_nba_archive_zip_benchmark.py'
      - 'model.py'
      - 'slate_import.py'
      - 'nba_prelock_robustness.py'
      - 'test_nba_prelock_robustness.py'
      - 'site_ui.py'
      - '.github/workflows/nba-prelock-robustness.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_nba_live_prelock_fragility test_nba_prelock_robustness test_nba_prelock_ui_integration test_nba_optimizer_integration test_nba_csv_pipeline_integration test_nba_archived_slate_audit test_nba_archived_export_adapter test_nba_archive_zip_benchmark
      - run: python -m py_compile app.py site_ui.py nba_live_prelock_fragility.py nba_prelock_robustness.py
      - run: python -c 'import site_ui; from streamlit.testing.v1 import AppTest; app = AppTest.from_file("app.py").run(timeout=45); assert not app.exception, [str(e.message) for e in app.exception]'
